<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Hello  Student</h1>
    <button onclick="changeText()">Click me</button>

    <p id="para">This is text</p>
    <button onclick="changecolor()">Changr Color</button>
     
    <br><br>
    <input type="password" id="pwd">
    <button onclick="togglePassword()">Show</button>

    <br><br>
    <input type="text" id="taskInput">
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList"></ul>

    <!-- ========================================== -->
     <ul id="list">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
     </ul>
    <!-- =========================================== -->
     <h2 id="count">0</h2>
     <button id="likeBtn">Like</button>
     <!-- ========================================== -->
      <button id="themeBtn">Toggle Theme</button>
      <style>
        .dark{
            background-color: aqua;
            color: black;
        }
      </style>
      <!-- ============================================== -->
       <br><br>
       <textarea id="message"></textarea>
       <p>Characters: <span id="charCount">0</span></p>
    <script>
        function changeText(){
            document.getElementById("title").innerText="Welcome to DOM class";
        }
        function changecolor(){
            document.getElementById("para").style.color="red";
        }

        function togglePassword(){
            let input=document.getElementById("pwd");
            if(input.type==="password"){
                input.type="text";
            }
            else{
                input.type="password";
            }
        }

        function addTask(){
            let taskValue=document.getElementById("taskInput").value;
            let li=document.createElement("li");
            li.innerText=taskValue;
            document.getElementById("taskList").appendChild(li);
            document.getElementById("taskInput").value="";
        }

        // =======================================================================================
        let items=document.querySelectorAll("#list li");
        items.forEach(function(item){
            item.addEventListener("click",function(){
                item.remove();
            });
        });
        // ===========================================================================================
        let count=0;
        document.getElementById("likeBtn").addEventListener("click",function(){
            count++;
            document.getElementById("count").innerText=count;
        });
        // ==========================================================================================
        document.getElementById("themeBtn").addEventListener("click",function(){
            document.body.classList.toggle("dark");
        });
        // ====================================================================================
        document.getElementById("message").addEventListener("input",function(){
            let length=this.value.length;
            document.getElementById("charCount").innerText=length;
        })
    </script>
</body>
</html>
